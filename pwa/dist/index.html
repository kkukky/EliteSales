<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0E0E10">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ELITE 루틴">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ELITE 루틴 체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Poppins:ital,wght@1,800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3F2;--card:#FFFFFF;--text:#0E0E10;--sub:#5B5A5F;--line:#E2E0DE;--soft:#ECEAE8;
  --brand:#9B1115;--brand-text:#9B1115;--hero:#0E0E10;--hero-accent:#E5383B;--stage:#D6D4D2;
  --ibg:#0E0E10;--ifg:#FFFFFF;
  --ok:#1E7A46;--ok-bg:#DDF1E5;--warn:#8A5A00;--warn-bg:#FBEBC8;--bad:#9B1115;--bad-bg:#F8DCDD;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0C;--card:#161617;--text:#F3F1EF;--sub:#A19FA5;--line:#2A2A2C;--soft:#232325;
    --brand:#C4161C;--brand-text:#F0595E;--hero:#1F1F21;--stage:#000000;
    --ibg:#F3F1EF;--ifg:#0B0B0C;
    --ok:#5FD18B;--ok-bg:#12301F;--warn:#F2B84B;--warn-bg:#3A2A08;--bad:#F0595E;--bad-bg:#3A1214;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0C;--card:#161617;--text:#F3F1EF;--sub:#A19FA5;--line:#2A2A2C;--soft:#232325;
  --brand:#C4161C;--brand-text:#F0595E;--hero:#1F1F21;--stage:#000000;
  --ibg:#F3F1EF;--ifg:#0B0B0C;
  --ok:#5FD18B;--ok-bg:#12301F;--warn:#F2B84B;--warn-bg:#3A2A08;--bad:#F0595E;--bad-bg:#3A1214;
}
*{box-sizing:border-box}
html{--tabh:57px;--barh:73px}
html,body,.screen{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.screen::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;min-height:100%}
body{background:var(--stage);color:var(--text);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center;word-break:keep-all;overflow-wrap:break-word}
.frame{container-type:size;position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;transform:translateZ(0)}
@media (min-width:481px){
  body{padding:24px 0;min-height:100vh}
  .frame{width:360px;height:772px;border-radius:28px;box-shadow:0 0 0 8px #0E0E10,0 24px 60px rgba(0,0,0,.35)}
}
.h{font-family:'Poppins','Noto Sans KR',sans-serif;font-weight:800;font-style:italic}
.screen{position:absolute;top:0;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 20px}
.screen.hasbar{bottom:calc(var(--tabh) + var(--barh) + env(safe-area-inset-bottom,0px))}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}

/* 상단 브랜드 줄 */
.brand{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo svg.i{width:30px;height:30px;color:var(--brand-text)}
.logo b{font-size:22px;color:var(--brand-text);letter-spacing:.01em}
.logo span{font-weight:700;color:var(--sub);font-size:15px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--sub);display:grid;place-items:center;border-radius:4px;cursor:pointer}

/* 상단 카드 */
.hero{background:var(--hero);color:#F3F1EF;padding:20px 16px 16px;border-radius:6px;clip-path:polygon(0 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%);margin-bottom:8px}
.hero .date{color:#B9B6BB;font-size:15px}
.hero .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.hero h1{margin:0;font-size:22px;line-height:1.35;color:#fff;min-width:0}
.big{font-size:56px;line-height:1;color:#ECEAE9;white-space:nowrap}
.big small{font-size:26px;color:#9E9BA1}
.seg{display:flex;gap:6px;margin:18px 4px 18px}
.seg i{flex:1;height:8px;background:rgba(255,255,255,.2);transform:skewX(-20deg)}
.seg i.on{background:var(--hero-accent)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;width:100%;border:0;border-radius:4px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;padding:0 16px}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.sm{min-height:44px;width:auto;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="false"]{background:var(--soft);color:var(--text)}

.sub{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:17px;font-weight:700}
.sub::before{content:'';width:6px;height:16px;background:var(--brand);transform:skewX(-20deg)}

.list{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px;color:inherit;text-decoration:none;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ib{width:48px;height:48px;flex:none;border-radius:4px;background:var(--ibg);color:var(--ifg);display:grid;place-items:center}
.ib.done{background:var(--ok-bg);color:var(--ok)}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:16px;line-height:1.35}
.rt>span{display:block;color:var(--sub);font-size:15px;line-height:1.4}
.np{white-space:nowrap}
.late{color:var(--bad);font-weight:700}
.chev{color:var(--sub);width:20px;height:20px}
.chip{flex:none;display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:3px;font-size:13px;font-weight:700;background:var(--soft);color:var(--sub);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.ex{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:3px;font-size:13px;font-weight:700;background:var(--warn-bg);color:var(--warn)}
.note{color:var(--sub);font-size:15px;margin:12px 2px 0}

/* 하단 탭, 하단 고정 바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom,0px));box-sizing:border-box;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.kv:first-of-type{border-top:0}.kv span{color:var(--sub)}.kv b{text-align:right;word-break:keep-all}.kv .ok{color:var(--ok,#1a7f45)}.kv .no{color:var(--brand-text)}
.score{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.score button{min-height:62px;border:1px solid var(--line);border-radius:4px;background:var(--soft);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;font-family:inherit}
.score button b{font-size:22px;line-height:1.1}.score button span{font-size:12px;color:var(--sub);font-weight:700}
.score button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}.score button[aria-pressed="true"] span{color:#fff}
.aimg{background:var(--soft);border-radius:4px;display:grid;place-items:center;height:92px;margin-bottom:12px}
.aimg svg{width:150px;height:76px;fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.aimg .ac{stroke:var(--brand)}.aimg .af{fill:var(--brand);stroke:none}
.act h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.act p{margin:0 0 12px;color:var(--text)}
.act .timer{font-size:30px;text-align:center;margin:0 0 10px;color:var(--brand-text)}
.hint{background:var(--soft);border-radius:4px;padding:12px 14px;margin:0 0 12px;font-size:14px;color:var(--sub)}
.hero.cp{padding:12px 14px 12px;clip-path:polygon(0 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%);margin-bottom:0}
.hero.cp .top{align-items:center;margin-top:2px}.hero.cp h1{font-size:19px;line-height:1.3}.hero.cp .date{font-size:13px}
.hero.cp .big{font-size:36px}.hero.cp .big small{font-size:18px}.hero.cp .seg{margin:10px 4px 10px}.hero.cp .seg i{height:6px}.hero.cp .btn{min-height:42px;font-size:15px}
.sub.cs{margin:12px 0 6px;font-size:16px}
.shb{flex:1;min-width:0;display:flex;align-items:center;gap:8px;margin:0;padding:6px 0;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.shb .chip{min-height:24px;padding:0 8px;font-size:12px;margin-left:2px}
.shb .cv{margin-left:auto;width:18px;height:18px;color:var(--sub);transition:transform .15s}
.shb[aria-expanded="true"] .cv{transform:rotate(90deg)}
.wk{--rowh:clamp(40px,calc((100cqh - 680px) / 5),58px);background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.wk-r{display:grid;grid-template-columns:104px repeat(5,1fr);align-items:stretch;border-top:1px solid var(--line);min-height:44px;min-height:var(--rowh)}
.wk-r:first-child{border-top:0}
.wk-h{min-height:40px}.wk-f{min-height:26px}
.wk-l{display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:var(--sub)}
.wk-n{display:flex;align-items:center;padding:0 8px 0 10px;color:var(--text);text-decoration:none;font-size:13px;line-height:1.25;font-weight:700;word-break:keep-all}
.wk-c{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--sub);font-size:12px;font-weight:700}
.wk-c.t{background:var(--soft)}
.wk-d{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.15;color:var(--sub);font-weight:700}
.wk-d b{font-size:14px;color:var(--text)}.wk-d.t{background:var(--brand);color:#fff}.wk-d.t b{color:#fff}
.mk{width:24px;height:24px;border-radius:3px;display:grid;place-items:center}
.mk svg{width:16px;height:16px}
.mk.ok{background:var(--ok-bg);color:var(--ok)}.mk.late{background:var(--warn-bg);color:var(--warn)}
.mk.todo{border:2px solid var(--brand)}.mk.none{color:var(--sub);opacity:.6;font-size:13px}
.wk-f .wk-c.t{color:var(--brand-text)}
.wk.mt .wk-r{min-height:36px}
.mk.sc{font-size:14px;font-weight:800;border-radius:4px;width:34px;height:26px}
.mk.sc.s1,.mk.sc.s2{background:var(--bad-bg);color:var(--bad)}.mk.sc.s3{background:var(--warn-bg);color:var(--warn)}.mk.sc.s4,.mk.sc.s5{background:var(--ok-bg);color:var(--ok)}
.mk.sc.todo{width:22px;height:22px}
.swr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.swr b{font-size:14px}
.sw{position:relative;flex:none;width:52px;height:30px;border:0;border-radius:15px;background:var(--line);cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--brand)}.sw[aria-checked="true"]::after{transform:translateX(22px)}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sh .sub{margin-bottom:6px}
.btn.xs{margin-left:auto;min-height:34px;padding:0 12px;font-size:13px;width:auto;gap:4px}.btn.xs .i{width:16px;height:16px}
.pr{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:8px}
.pr-h{display:flex;align-items:center;gap:8px}.pr-h b{flex:1;min-width:0;font-size:15px;word-break:keep-all}
.pr-h .chip{min-height:22px;padding:0 7px;font-size:11px}
.pr-h .ib2{flex:none;width:34px;height:34px;border:0;border-radius:4px;background:var(--soft);color:var(--sub);display:grid;place-items:center;cursor:pointer}
.pr-h .ib2 svg{width:18px;height:18px}
.pr .tg{width:100%;min-height:46px;margin-top:10px;border:1px solid var(--line);border-radius:4px;background:var(--soft);color:var(--text);font:700 15px inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.pr .tg[aria-pressed="true"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pr .tg svg{width:18px;height:18px}
.pr .score button{min-height:46px}.pr .score button b{font-size:19px}
.pr-w{display:grid;grid-template-columns:repeat(5,1fr);margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.pr-w>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--sub);padding:4px 0;border-radius:3px}
.pr-w>div.t{background:var(--soft)}.pr-w>div.t i{color:var(--brand-text)}.pr-w i{font-style:normal}
.pe{padding:18px 12px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:6px;color:var(--sub);font-size:14px;line-height:1.5}
.sheet input.pn{width:100%;box-sizing:border-box}
.row.sm{min-height:56px;padding:8px 12px}.row.sm .rt>span{font-size:14px}.row.sm .ib{width:40px;height:40px}
.decl{position:relative;margin:8px 0 0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:6px;padding:12px 14px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.decl p{margin:0 0 8px;font-size:15px;line-height:1.5;font-weight:700;word-break:keep-all;white-space:pre-line}
.decl .df{display:flex;align-items:center;justify-content:space-between;gap:8px}
.decl .dc{font-size:12px;color:var(--sub);font-weight:700}
.decl .de{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 10px;border:0;border-radius:3px;background:var(--soft);color:var(--text);font:700 13px inherit;font-family:inherit;cursor:pointer}
.decl .de svg{width:14px;height:14px}
.decl.flash{animation:dflash .55s ease}
@keyframes dflash{0%{background:var(--soft);box-shadow:0 0 0 3px rgba(150,3,3,.25)}100%{background:var(--card);box-shadow:none}}
.modal{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.modal .bd{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:relative;width:100%;max-height:92%;overflow-y:auto;background:var(--card);border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet textarea{width:100%;min-height:92px;box-sizing:border-box;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);font:600 16px/1.5 inherit;font-family:inherit;padding:10px 12px;resize:none}
.sheet .tc{text-align:right;font-size:12px;color:var(--sub);margin:4px 2px 10px}
.tips{margin-top:16px;padding:12px 14px;background:var(--soft);border-radius:4px;font-size:14px;color:var(--text)}
.tips b{display:block;margin:0 0 6px;font-size:14px}.tips ul{margin:0 0 12px;padding-left:18px}.tips li{margin:0 0 4px;color:var(--sub)}
.tips .ex{display:block;width:100%;text-align:left;margin:0 0 6px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--text);font:600 14px/1.45 inherit;font-family:inherit;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips button{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:20px;background:var(--soft);color:var(--text);font:700 14px inherit;font-family:inherit;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.slots button{min-height:44px;border:0;border-radius:4px;background:var(--soft);color:var(--text);font:700 15px inherit;font-family:inherit;cursor:pointer}
.slots button[aria-pressed="true"]{background:var(--brand);color:#fff}
.coreg{margin:0 0 10px;font-size:17px;font-weight:700;line-height:1.4;word-break:keep-all}
.tab{position:relative;flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);text-decoration:none;font-size:13px;font-weight:700}
.tab[aria-current="page"]{color:var(--brand-text)}
.tab[aria-current="page"]::before{content:'';position:absolute;top:0;left:50%;width:32px;height:4px;margin-left:-16px;background:var(--brand);transform:skewX(-20deg)}
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));height:var(--barh);box-sizing:border-box;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line)}

/* 상세 */
.dh{display:flex;align-items:center;gap:12px;min-height:56px}
.back{width:44px;height:44px;flex:none;border:0;border-radius:4px;background:var(--soft);color:var(--text);display:grid;place-items:center;cursor:pointer}
.dh h2{margin:0;font-size:22px;line-height:1.3}
.lead{color:var(--sub);margin:4px 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
.card.imminent{border-color:var(--warn)}
.ct{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:17px;font-weight:700;margin-bottom:8px}
.card p{margin:4px 0}
.muted{color:var(--sub)}
.clock{font-size:44px;line-height:1.2;text-align:center}
.erow{display:flex;gap:12px;align-items:baseline;min-height:44px;align-items:center;border-top:1px solid var(--line)}
.erow:first-of-type{border-top:0}
.erow .time{width:92px;flex:none;font-size:16px;white-space:nowrap;color:var(--brand-text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.result{margin:10px 0 0;font-weight:700}
.task{display:flex;align-items:center;gap:4px;min-height:48px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.task input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--brand);margin:0}
.task .tt{flex:1;min-width:0}
.task .tm{color:var(--sub);font-size:15px}
.task.done .tt{text-decoration:line-through;color:var(--sub)}
.form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.form input[type=text]{grid-column:1 / -1}
input[type=text],input[type=time]{min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);padding:0 12px;width:100%}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border:1px solid var(--line);background:var(--soft);border-radius:4px;color:var(--text);font-size:22px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.step output{min-width:56px;text-align:center;font-size:20px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.srow span{color:var(--sub)}
.track{height:10px;background:var(--soft);transform:skewX(-20deg);margin:10px 6px 4px}
.track i{display:block;height:100%;background:var(--brand)}

    '<div style="margin-top:8px;display:grid;grid-template-columns:1fr auto;gap:8px"><input id="nameIn" type="text" maxlength="20" value="' + esc(P ? P.name : '') + '" placeholder="이름" aria-label="이름" style="min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);padding:0 12px;width:100%"><button class="btn ghost sm" data-act="name-save"><span>이름 저장</span></button></div>' +
    kv('마지막 서버 저장', st) +
    '<div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn ghost" data-act="sync-now"><span>지금 동기화</span></button><button class="btn ghost" data-act="auth-logout"><span>로그아웃</span></button></div></div>';
}

var SYNC = {
  profile: null, team: null, teamBusy: false, teamErr: '', err: '', last: 0, pending: false, timer: null, flying: false, started: false,
  dirty: function () { if (!AUTH) return; SYNC.pending = true; clearTimeout(SYNC.timer); SYNC.timer = setTimeout(function () { SYNC.flush(false); }, 3000); },
  rows: function (all) {
    var out = [], mk = function (d, at, cells, n) { return { user_id: AUTH.uid, d: d, attend_at: at ? new Date(at).toISOString() : null, cells: cells, done_count: n, updated_at: new Date().toISOString() }; };
    out.push(mk(S.date, S.done.attend ? S.done.attend.at : null, ITEMS.map(function (i) { return S.done[i.id] ? 1 : 0; }), doneCount()));
    if (all) Object.keys(S.history).forEach(function (k) { var x = S.history[k]; out.push(mk(k, x.at, x.cells || [], x.n || 0)); });
    return out;
  },
  flush: function (manual) {
    if (!AUTH || SYNC.flying) return Promise.resolve();
    if (!navigator.onLine) { SYNC.err = manual ? '인터넷에 연결되어 있지 않아요' : ''; if (manual) render(); return Promise.resolve(); }
    SYNC.flying = true; var sa = S.savedAt || 0, first = !SYNC.pushedAll;
    return api('/rest/v1/elite_state?on_conflict=user_id', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal',
      body: { user_id: AUTH.uid, data: S, saved_at: sa, updated_at: new Date().toISOString() } })
      .then(function () { return api('/rest/v1/elite_daily?on_conflict=user_id,d', { method: 'POST', prefer: 'resolution=merge-duplicates,return=minimal', body: SYNC.rows(first) }); })
      .then(function () { SYNC.pushedAll = true; SYNC.last = Date.now(); SYNC.err = ''; SYNC.flying = false; SYNC.pending = (S.savedAt || 0) !== sa; if (SYNC.pending) SYNC.dirty(); if (route() === 'settings') render(); })
      .catch(function (er) { SYNC.flying = false; SYNC.err = '서버 저장 실패'; if (er && er.status === 401) SYNC.err = '다시 로그인이 필요해요'; if (route() === 'settings') render(); });
  },
  pull: function () {
    return api('/rest/v1/elite_state?user_id=eq.' + AUTH.uid + '&select=data,saved_at').then(function (rows) {
      var r = rows && rows[0];
      if (r && r.data && r.saved_at > (S.savedAt || 0)) {
        try { localStorage.setItem(KEY, JSON.stringify(r.data)); } catch (e) { return; }
        location.reload(); return 'reload';
      }
      return SYNC.flush(false);
    });
  },
  start: function () {
    if (!AUTH || SYNC.started) return; SYNC.started = true;
    api('/rest/v1/elite_profiles?id=eq.' + AUTH.uid + '&select=name,role').then(function (rows) {
      SYNC.profile = (rows && rows[0]) || { name: '', role: 'planner' }; render();
    }).catch(function () { SYNC.profile = { name: '', role: 'planner' }; });
    SYNC.pull().catch(function () { SYNC.err = '서버에 연결하지 못했어요'; });
    window.addEventListener('online', function () { if (SYNC.pending) SYNC.flush(false); });
    document.addEventListener('visibilitychange', function () { if (document.hidden && SYNC.pending) SYNC.flush(false); });
  }
};
function loadTeam() {
  if (!isAdmin() || SYNC.teamBusy) return;
  SYNC.teamBusy = true; SYNC.teamErr = ''; var from = dstr(now() - 7 * 86400000), today = dstr(now());
  Promise.all([api('/rest/v1/elite_profiles?select=id,name,role&order=created_at'), api('/rest/v1/elite_daily?d=gte.' + from + '&select=user_id,d,attend_at,cells,done_count')]).then(function (res) {
    var by = {}; res[1].forEach(function (r) { (by[r.user_id] = by[r.user_id] || []).push(r); });
    SYNC.team = { list: res[0].map(function (p) {
      var rs = by[p.id] || [], t = rs.filter(function (r) { return r.d === today; })[0], c = ITEMS.map(function (x, i) { return t && t.cells && t.cells[i] ? 1 : 0; });
      return { n: p.name || '(이름 없음)', t: t && t.attend_at ? hm(new Date(t.attend_at).getTime()) : null, c: c, w: rs.length ? Math.round(rs.reduce(function (a, r) { return a + r.done_count; }, 0) / rs.length * 10) / 10 : 0 };
    }) };
    SYNC.teamBusy = false; if (route() === 'admin') render();
  }).catch(function (er) { SYNC.teamBusy = false; SYNC.teamErr = '불러오지 못했어요: ' + er.message; SYNC.team = SYNC.team || { list: [] }; if (route() === 'admin') render(); });
}

/* ---------- 시작 ---------- */
try { var th = localStorage.getItem(THEME_KEY); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); } catch (e) { }
render();
SYNC.start();
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { }); }); }
})();
</script>
</body>
</html>
