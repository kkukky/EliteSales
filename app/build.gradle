plugins { id 'com.android.application' }
android {
    namespace 'kr.elite.routine'
    compileSdk 34
    defaultConfig {
        applicationId "kr.elite.routine"
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName "0.6-pilot"
    }
    flavorDimensions 'who'
    productFlavors {
        admin   { dimension 'who'; manifestPlaceholders = [appLabel: 'ELITE 루틴 (관리자)'] }
        planner { dimension 'who'; applicationIdSuffix '.planner'; versionNameSuffix '-planner'; manifestPlaceholders = [appLabel: 'ELITE 루틴 (설계사)'] }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
