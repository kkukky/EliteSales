<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ELITE 루틴 체크</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;family=Poppins:ital,wght@1,800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3F2;--card:#FFFFFF;--text:#0E0E10;--sub:#5B5A5F;--line:#E2E0DE;--soft:#ECEAE8;
  --brand:#9B1115;--brand-text:#9B1115;--hero:#0E0E10;--hero-accent:#E5383B;--stage:#D6D4D2;
  --ibg:#0E0E10;--ifg:#FFFFFF;
  --ok:#1E7A46;--ok-bg:#DDF1E5;--warn:#8A5A00;--warn-bg:#FBEBC8;--bad:#9B1115;--bad-bg:#F8DCDD;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0B0C;--card:#161617;--text:#F3F1EF;--sub:#A19FA5;--line:#2A2A2C;--soft:#232325;
    --brand:#C4161C;--brand-text:#F0595E;--hero:#1F1F21;--stage:#000000;
    --ibg:#F3F1EF;--ifg:#0B0B0C;
    --ok:#5FD18B;--ok-bg:#12301F;--warn:#F2B84B;--warn-bg:#3A2A08;--bad:#F0595E;--bad-bg:#3A1214;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0B0C;--card:#161617;--text:#F3F1EF;--sub:#A19FA5;--line:#2A2A2C;--soft:#232325;
  --brand:#C4161C;--brand-text:#F0595E;--hero:#1F1F21;--stage:#000000;
  --ibg:#F3F1EF;--ifg:#0B0B0C;
  --ok:#5FD18B;--ok-bg:#12301F;--warn:#F2B84B;--warn-bg:#3A2A08;--bad:#F0595E;--bad-bg:#3A1214;
}
*{box-sizing:border-box}
html{--tabh:57px;--barh:73px}
html,body,.screen{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,.screen::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;min-height:100%}
body{background:var(--stage);color:var(--text);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:15px;line-height:1.5;display:flex;align-items:center;justify-content:center;word-break:keep-all;overflow-wrap:break-word}
.frame{container-type:size;position:relative;width:100%;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;transform:translateZ(0)}
@media (min-width:481px){
  body{padding:24px 0;min-height:100vh}
  .frame{width:360px;height:772px;border-radius:28px;box-shadow:0 0 0 8px #0E0E10,0 24px 60px rgba(0,0,0,.35)}
}
.h{font-family:'Poppins','Noto Sans KR',sans-serif;font-weight:800;font-style:italic}
.screen{position:absolute;top:0;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 20px}
.screen.hasbar{bottom:calc(var(--tabh) + var(--barh) + env(safe-area-inset-bottom,0px))}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,input{font-family:inherit}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}

/* 상단 브랜드 줄 */
.brand{display:flex;align-items:center;justify-content:space-between;min-height:44px;margin-bottom:6px}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo svg.i{width:30px;height:30px;color:var(--brand-text)}
.logo b{font-size:22px;color:var(--brand-text);letter-spacing:.01em}
.logo span{font-weight:700;color:var(--sub);font-size:15px}
.iconbtn{width:44px;height:44px;border:0;background:transparent;color:var(--sub);display:grid;place-items:center;border-radius:4px;cursor:pointer}

/* 상단 카드 */
.hero{background:var(--hero);color:#F3F1EF;padding:20px 16px 16px;border-radius:6px;clip-path:polygon(0 0,100% 0,100% calc(100% - 28px),calc(100% - 28px) 100%,0 100%);margin-bottom:8px}
.hero .date{color:#B9B6BB;font-size:15px}
.hero .top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:4px}
.hero h1{margin:0;font-size:22px;line-height:1.35;color:#fff;min-width:0}
.big{font-size:56px;line-height:1;color:#ECEAE9;white-space:nowrap}
.big small{font-size:26px;color:#9E9BA1}
.seg{display:flex;gap:6px;margin:18px 4px 18px}
.seg i{flex:1;height:8px;background:rgba(255,255,255,.2);transform:skewX(-20deg)}
.seg i.on{background:var(--hero-accent)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;width:100%;border:0;border-radius:4px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;padding:0 16px}
.btn.ghost{background:var(--soft);color:var(--text)}
.btn.sm{min-height:44px;width:auto;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="false"]{background:var(--soft);color:var(--text)}

.sub{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-size:17px;font-weight:700}
.sub::before{content:'';width:6px;height:16px;background:var(--brand);transform:skewX(-20deg)}

.list{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:76px;padding:12px;color:inherit;text-decoration:none;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ib{width:48px;height:48px;flex:none;border-radius:4px;background:var(--ibg);color:var(--ifg);display:grid;place-items:center}
.ib.done{background:var(--ok-bg);color:var(--ok)}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:16px;line-height:1.35}
.rt>span{display:block;color:var(--sub);font-size:15px;line-height:1.4}
.np{white-space:nowrap}
.late{color:var(--bad);font-weight:700}
.chev{color:var(--sub);width:20px;height:20px}
.chip{flex:none;display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:3px;font-size:13px;font-weight:700;background:var(--soft);color:var(--sub);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.ex{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:3px;font-size:13px;font-weight:700;background:var(--warn-bg);color:var(--warn)}
.note{color:var(--sub);font-size:15px;margin:12px 2px 0}

/* 하단 탭, 하단 고정 바 */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabh) + env(safe-area-inset-bottom,0px));box-sizing:border-box;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}.kv:first-of-type{border-top:0}.kv span{color:var(--sub)}.kv b{text-align:right;word-break:keep-all}.kv .ok{color:var(--ok,#1a7f45)}.kv .no{color:var(--brand-text)}
.score{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.score button{min-height:62px;border:1px solid var(--line);border-radius:4px;background:var(--soft);color:var(--text);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;font-family:inherit}
.score button b{font-size:22px;line-height:1.1}.score button span{font-size:12px;color:var(--sub);font-weight:700}
.score button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}.score button[aria-pressed="true"] span{color:#fff}
.aimg{background:var(--soft);border-radius:4px;display:grid;place-items:center;height:92px;margin-bottom:12px}
.aimg svg{width:150px;height:76px;fill:none;stroke:var(--text);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.aimg .ac{stroke:var(--brand)}.aimg .af{fill:var(--brand);stroke:none}
.act h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.act p{margin:0 0 12px;color:var(--text)}
.act .timer{font-size:30px;text-align:center;margin:0 0 10px;color:var(--brand-text)}
.hint{background:var(--soft);border-radius:4px;padding:12px 14px;margin:0 0 12px;font-size:14px;color:var(--sub)}
.hero.cp{padding:12px 14px 12px;clip-path:polygon(0 0,100% 0,100% calc(100% - 20px),calc(100% - 20px) 100%,0 100%);margin-bottom:0}
.hero.cp .top{align-items:center;margin-top:2px}.hero.cp h1{font-size:19px;line-height:1.3}.hero.cp .date{font-size:13px}
.hero.cp .big{font-size:36px}.hero.cp .big small{font-size:18px}.hero.cp .seg{margin:10px 4px 10px}.hero.cp .seg i{height:6px}.hero.cp .btn{min-height:42px;font-size:15px}
.sub.cs{margin:12px 0 6px;font-size:16px}
.wk{--rowh:clamp(38px,calc((100cqh - 548px) / 5),58px);background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.wk-r{display:grid;grid-template-columns:90px repeat(7,1fr);align-items:stretch;border-top:1px solid var(--line);min-height:44px;min-height:var(--rowh)}
.wk-r:first-child{border-top:0}
.wk-h{min-height:40px}.wk-f{min-height:26px}
.wk-l{display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:700;color:var(--sub)}
.wk-n{display:flex;align-items:center;padding:0 8px 0 10px;color:var(--text);text-decoration:none;font-size:13px;line-height:1.25;font-weight:700;word-break:keep-all}
.wk-c{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--sub);font-size:12px;font-weight:700}
.wk-c.t{background:var(--soft)}
.wk-d{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.15;color:var(--sub);font-weight:700}
.wk-d b{font-size:14px;color:var(--text)}.wk-d.t{background:var(--brand);color:#fff}.wk-d.t b{color:#fff}
.mk{width:24px;height:24px;border-radius:3px;display:grid;place-items:center}
.mk svg{width:16px;height:16px}
.mk.ok{background:var(--ok-bg);color:var(--ok)}.mk.late{background:var(--warn-bg);color:var(--warn)}
.mk.todo{border:2px solid var(--brand)}.mk.none{color:var(--sub);opacity:.6;font-size:13px}
.wk-f .wk-c.t{color:var(--brand-text)}
.row.sm{min-height:56px;padding:8px 12px}.row.sm .ib{width:40px;height:40px}
.tab{position:relative;flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);text-decoration:none;font-size:13px;font-weight:700}
.tab[aria-current="page"]{color:var(--brand-text)}
.tab[aria-current="page"]::before{content:'';position:absolute;top:0;left:50%;width:32px;height:4px;margin-left:-16px;background:var(--brand);transform:skewX(-20deg)}
.actionbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));height:var(--barh);box-sizing:border-box;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line)}

/* 상세 */
.dh{display:flex;align-items:center;gap:12px;min-height:56px}
.back{width:44px;height:44px;flex:none;border:0;border-radius:4px;background:var(--soft);color:var(--text);display:grid;place-items:center;cursor:pointer}
.dh h2{margin:0;font-size:22px;line-height:1.3}
.lead{color:var(--sub);margin:4px 2px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:12px}
.card.imminent{border-color:var(--warn)}
.ct{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:17px;font-weight:700;margin-bottom:8px}
.card p{margin:4px 0}
.muted{color:var(--sub)}
.clock{font-size:44px;line-height:1.2;text-align:center}
.erow{display:flex;gap:12px;align-items:baseline;min-height:44px;align-items:center;border-top:1px solid var(--line)}
.erow:first-of-type{border-top:0}
.erow .time{width:92px;flex:none;font-size:16px;white-space:nowrap;color:var(--brand-text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.result{margin:10px 0 0;font-weight:700}
.task{display:flex;align-items:center;gap:4px;min-height:48px;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.task input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--brand);margin:0}
.task .tt{flex:1;min-width:0}
.task .tm{color:var(--sub);font-size:15px}
.task.done .tt{text-decoration:line-through;color:var(--sub)}
.form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.form input[type=text]{grid-column:1 / -1}
input[type=text],input[type=time]{min-height:44px;font-size:16px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--text);padding:0 12px;width:100%}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border:1px solid var(--line);background:var(--soft);border-radius:4px;color:var(--text);font-size:22px;font-weight:700;cursor:pointer;display:grid;place-items:center;padding:0}
.step output{min-width:56px;text-align:center;font-size:20px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.srow span{color:var(--sub)}
.track{height:10px;background:var(--soft);transform:skewX(-20deg);margin:10px 6px 4px}
.track i{display:block;height:100%;background:var(--brand)}
.bignum{font-size:32px;line-height:1.2}
.stg{display:flex;gap:4px;margin:8px 4px}
.stg i{flex:1;height:6px;background:var(--soft);transform:skewX(-20deg)}
.stg i.on{background:var(--brand)}
.crow{padding:12px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chead b{font-size:16px}

/* 관리자, 기록 */
.day{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px 6px;margin-bottom:10px}
.day.today{border-color:var(--brand)}
.dhd{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px;margin-bottom:4px}
.dhd b{font-size:16px}
.lr{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lr .st{width:20px;height:20px;margin-top:2px}
.lr .st.ok{color:var(--ok)}.lr .st.no{color:var(--line)}
.lr .lb{width:36px;flex:none;color:var(--sub);font-weight:700}
.lr .lv{flex:1;min-width:0}
.pt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.seg3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg3 button{min-height:44px;border:0;border-radius:4px;background:var(--soft);color:var(--text);font-size:15px;font-weight:700;cursor:pointer;padding:0 4px}
.seg3 button[aria-pressed="true"]{background:var(--brand);color:#fff}
.cap{color:var(--sub);font-size:14px;margin:0 2px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 8px;text-align:center}
.stat .h{display:block;font-size:26px;line-height:1.2}
.stat span:last-child{font-size:13px;color:var(--sub);font-weight:700}
.prow{padding:12px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.pl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pl b{font-size:16px}
.cells{display:flex;align-items:center;gap:4px;margin-top:8px}
.cells i{width:22px;height:8px;background:var(--soft);transform:skewX(-20deg)}
.cells i.on{background:var(--brand)}
.cells em{font-style:normal;margin-left:10px;color:var(--sub);font-size:15px;font-weight:700}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (prefers-reduced-motion:no-preference){.btn,.back,.step button{transition:filter .12s}.btn:active,.step button:active{filter:brightness(.92)}}
</style>
<style id="splash-css">
#splash{position:fixed;inset:0;z-index:99999;background:#14161A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s}
#splash::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#14161A 0 55%,#960303 55%)}
#splash img{width:min(70vw,300px);height:auto;box-sizing:content-box;background:#fff;padding:22px 24px;border-radius:4px;animation:sp-in .8s ease both}
#splash p{margin:0;color:#B9B9B9;font:700 13px/1 'Noto Sans KR',sans-serif;letter-spacing:.18em;animation:sp-in .8s .35s ease both}
#splash i{display:block;width:64px;height:4px;background:#960303;transform:skewX(-20deg);animation:sp-bar 1.4s ease both}
#splash.out{opacity:0;pointer-events:none}
@keyframes sp-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sp-bar{from{width:0}to{width:64px}}
</style>
</head>

<symbol id="i-today" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/><path d="M8 12.5l3 3 5-6"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 16h6"/></symbol>
<symbol id="i-bars" viewBox="0 0 24 24"><path d="M4 20.5h16M7 20V12M12 20V5M17 20v-5"/></symbol>

<script>
(function () {
'use strict';

/* ---------- 설정 (예시 설정, 필요하면 여기서 바꿔요) ---------- */

var PEOPLE = [
  { n: '설계사 A', t: '08:41', c: [1, 1, 1, 1, 1, 1] },
  { n: '설계사 B', t: '08:58', c: [1, 1, 1, 1, 0, 1] },
  { n: '설계사 C', t: '09:12', c: [1, 1, 0, 1, 0, 0] },
  { n: '설계사 D', t: null, c: [0, 0, 0, 0, 0, 0] },
  { n: '설계사 E', t: '08:49', c: [1, 1, 1, 0, 0, 1] },
  { n: '설계사 F', t: '09:03', c: [1, 0, 0, 0, 0, 0] }
];

/* ---------- 유틸 ---------- */
function now() { return Date.now(); }
function pad(n) { return (n < 10 ? '0' : '') + n; }

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ic(n, cls) { return '<svg class="i ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>'; }
var WD = ['일', '월', '화', '수', '목', '금', '토'];
function dayLabel(s) { var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2]); return (+p[1]) + '월 ' + (+p[2]) + '일 (' + WD[d.getDay()] + ')'; }
function longDate(t) { try { return new Date(t).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' }); } catch (e) { return dayLabel(dstr(t)); } }
function isLate(t) { var d = new Date(t); d.setHours(WORK_START_H, 0, 0, 0); return t > d.getTime(); }

/* ---------- 저장소: 모든 읽기와 쓰기는 try/catch ---------- */
function defaults() {
  return {
    v: 1, date: dstr(now()), done: {}, planDone: {}, answer: null, history: {}, mental: { emo: 0, body: 0, acts: {} }, hideSampleLog: false, logView: 'day',
    plan: [

      { id: 'p2', title: '제안서 점검', time: '11:00', sample: true },
      { id: 'p3', title: '방문 준비', time: '13:30', sample: true },
      { id: 'p4', title: '하루 정리와 내일 계획', time: '17:30', sample: true }

    goals: [
      { id: 'g1', name: '신규 계약', unit: '건', cur: 2, target: 5, sample: true },
      { id: 'g2', name: '상담', unit: '건', cur: 3, target: 10, sample: true }

    clients: [
      { id: 'c1', name: '고객 A', stage: 0, sample: true }, { id: 'c2', name: '고객 B', stage: 0, sample: true },
      { id: 'c3', name: '고객 C', stage: 1, sample: true }, { id: 'c4', name: '고객 D', stage: 1, sample: true },
      { id: 'c5', name: '고객 E', stage: 2, sample: true }, { id: 'c6', name: '고객 F', stage: 3, sample: true }

}
function load() {
  try { var raw = localStorage.getItem(KEY); if (!raw) return null; var o = JSON.parse(raw); return (o && typeof o === 'object') ? o : null; } catch (e) { return null; }
}
function save() { try { S.savedAt = now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 저장이 막혀도 화면은 계속 동작 */ } }
var S = (function () {

  if (!m.mental || typeof m.mental !== 'object') m.mental = { emo: 0, body: 0, acts: {} };
  if (!m.mental.acts) m.mental.acts = {};
  if (typeof m.date !== 'string') m.date = dstr(now());
  return m;
})();

var runAct = null;   // 실행 중인 행동 {id,end}
var MENTAL_IDS = ['mental'];   // 멘탈 루틴 항목(앞으로 추가)
var SALES = ITEMS.filter(function (i) { return MENTAL_IDS.indexOf(i.id) < 0; }), MENTAL = ITEMS.filter(function (i) { return MENTAL_IDS.indexOf(i.id) >= 0; });
function doneCount() { return ITEMS.filter(function (i) { return S.done[i.id]; }).length; }
function details() {
  var g = S.goals[0];
  return { ans: S.answer ? S.answer.v : '', pd: S.plan.filter(function (p) { return S.planDone[p.id]; }).length, pt: S.plan.length,
    g: g ? { name: g.name, cur: g.cur, target: g.target, unit: g.unit } : null, cn: S.clients.length, ck: S.clients.filter(function (c) { return c.stage >= 3; }).length,
    m: { emo: S.mental.emo, body: S.mental.body, acts: Object.keys(S.mental.acts).length } };
}
function rollover() {
  var t = dstr(now());
  if (S.date === t) return false;
  var n = doneCount(), a = S.done.attend;
  if (n > 0) S.history[S.date] = { n: n, cells: ITEMS.map(function (i) { return S.done[i.id] ? 1 : 0; }), at: a ? a.at : null, late: a ? !!a.late : false, det: details() };
  var keys = Object.keys(S.history).sort();
  while (keys.length > 60) delete S.history[keys.shift()];
  S.date = t; S.done = {}; S.planDone = {}; S.answer = null; S.mental = { emo: 0, body: 0, acts: {} }; runAct = null;   // 목표, 고객, 일정 목록은 유지
  save();
  return true;
}

/* ---------- 마감 규칙 ---------- */
function dlInfo() {
  var d = new Date(now()); d.setHours(DEADLINE_H, 0, 0, 0);
  var left = d.getTime() - now();
  return { left: left, locked: left <= 0, imminent: left > 0 && left <= IMMINENT_MS };
}
function fmtLeft(ms) {
  var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  return h > 0 ? h + '시간 ' + pad(m) + '분' : m + '분 ' + pad(ss) + '초';
}

/* ---------- 화면 조각 ---------- */
function anySample() {
  return S.plan.some(function (x) { return x.sample; }) || S.goals.some(function (x) { return x.sample; }) || S.clients.some(function (x) { return x.sample; });
}
function j(a) { return a.map(function (x) { return '<span class="np">' + x + '</span>'; }).join(' · '); }

  if (id === 'attend') { var a = S.done.attend; return a ? j([hm(a.at) + ' 출근', a.late ? '<span class="late">지각</span>' : '정상']) : '출근 시각을 기록해요'; }
  if (id === 'edu') return j(['오늘 ' + EDU_TODAY.length + '건', '이번 주 ' + EDU_WEEK.length + '건']);
  if (id === 'plan') { var dn = S.plan.filter(function (p) { return S.planDone[p.id]; }).length; return j(['오늘 일정 ' + S.plan.length + '개', dn + '개 완료']); }
  if (id === 'goal') { var g = S.goals[0]; return g ? j([esc(g.name) + ' ' + g.cur + '/' + g.target + esc(g.unit), '이번 달']) : '목표를 추가해 주세요'; }
  if (id === 'clients') { var k = S.clients.filter(function (c) { return c.stage >= 3; }).length; return S.clients.length ? j(['진행 고객 ' + S.clients.length + '명', '계약 ' + k + '명']) : '고객을 추가해 주세요'; }
  if (id === 'mental') { var mm = S.mental; return mm.emo && mm.body ? j(['감정 ' + mm.emo, '몸 ' + mm.body, '실행 ' + Object.keys(mm.acts).length + '개']) : '감정과 몸 상태 점수를 기록해요'; }
  return '';
}
function chipFor(id) {
  if (id === 'edu') { var di = dlInfo(); if (di.imminent && !S.answer) return '<span class="chip warn">마감 임박</span>'; }
  return S.done[id] ? '<span class="chip ok">완료</span>' : '<span class="chip">확인 전</span>';
}
function tabbar(cur) {
  var t = [['home', '오늘', 'today'], ['log', '기록', 'doc'], ['admin', '관리자', 'bars'], ['settings', '설정', 'gear']];

  }).join('') + '</nav>';
}
function curTheme() {
  var t = document.documentElement.getAttribute('data-theme');
  if (t) return t;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { return 'light'; }
}
function brandRow() {
  var dark = curTheme() === 'dark';
  return '<div class="brand"><div class="logo">' + ic('cube') + '<b class="h">ELITE</b><span>Sales Group</span></div>' +
    '<button class="iconbtn" data-act="theme" aria-label="' + (dark ? '라이트 모드로 바꾸기' : '다크 모드로 바꾸기') + '">' + ic(dark ? 'sun' : 'moon') + '</button></div>';
}
function detail(id, body) {
  var it = ITEMS.filter(function (i) { return i.id === id; })[0];
  var bar = S.done[id]

}
var EXTAG = '<span class="ex">예시 데이터입니다</span>';

/* ---------- 화면 ---------- */
var VIEWS = {};
function weekDays() {
  var p = S.date.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]), off = (d.getDay() + 6) % 7, out = [], i, x;
  for (i = 0; i < 7; i++) { x = new Date(d.getFullYear(), d.getMonth(), d.getDate() - off + i); out.push({ d: dstr(x.getTime()), wd: WD[x.getDay()], n: x.getDate() }); }
  return out;
}
function weekTable() {
  var days = weekDays(), by = {};

    return '<span class="wk-d' + (x.d === S.date ? ' t' : '') + '" role="columnheader"><i>' + x.wd + '</i><b>' + x.n + '</b></span>';
  }).join('') + '</div>';
  var rows = SALES.map(function (it, ri) {
    var idx = ITEMS.indexOf(it);
    return '<div class="wk-r" role="row"><a class="wk-n" href="#' + it.id + '">' + it.title + '</a>' + days.map(function (x) {

VIEWS.edu = function () {

  var m = S.mental, ready = m.emo && m.body, body;
  body = '<div class="card"><div class="ct">오늘 감정 점수</div><p class="muted">지금 마음은 어떤가요? 1 힘듦 ~ 5 최고</p>' + scoreRow('emo', EMO_L, m.emo) + '</div>' +
    '<div class="card"><div class="ct">오늘 몸 상태 점수</div><p class="muted">지금 몸은 어떤가요? 1 지침 ~ 5 최고</p>' + scoreRow('body', BODY_L, m.body) + '</div>';
  if (ready) {
    var rc = recommend(m.emo, m.body);
    var head = { low: '지금은 쉬어 가는 게 먼저예요', mid: '가볍게 리셋하고 시작해요', high: '좋은 상태예요. 이 흐름을 이어가요' }[rc.lv];
    body += '<h2 class="sub">' + head + '</h2><p class="cap">감정 ' + m.emo + ' · 몸 ' + m.body + '에 맞춰 골랐어요. 하나만 해도 충분해요.</p>' + rc.ids.map(actCard).join('');
    if (m.emo === 1) body += '<p class="hint">많이 힘들 땐 혼자 버티지 말고 멘탈코치나 지점장에게 바로 알려요. 지금 당장 너무 괴롭다면 24시간 상담전화 109에 연락할 수 있어요.</p>';
  } else {
    body += '<p class="hint">두 점수를 모두 기록하면 지금 상태에 맞는 행동을 보여드려요.</p>';
  }
  return detail('mental', body);
};

/* ---------- 라우팅과 렌더 ---------- */
var app = document.getElementById('app');
var lastRoute = null;
function route() { var h = (location.hash || '#home').slice(1); return VIEWS[h] ? h : 'home'; }
/* 안드로이드 앱: 알림 창에 오늘의 진행 상황 표시 (앱이 아닌 곳에서는 아무 일도 하지 않음) */
function syncNotif() {
  try {
    if (!window.AndroidBridge || !AndroidBridge.setProgress) return;
    if (S.notifOn === false) return;
    var n = doneCount(), total = ITEMS.length, next = ITEMS.filter(function (i) { return !S.done[i.id]; })[0];
    AndroidBridge.setProgress(n, total, n === total ? '오늘 루틴을 모두 마쳤어요' : '오늘의 루틴을 점검해요',
      next ? '다음 · ' + next.title : '오늘 기록 보기', longDate(now()), '다음 · ' + ITEMS[0].title);
  } catch (e) { }
}
function render() {
  rollover();
  var r = route(), sc = app.querySelector('.screen');
  var top = (sc && lastRoute === r) ? sc.scrollTop : 0;
  app.innerHTML = VIEWS[r]();
  var ns = app.querySelector('.screen'); if (ns) ns.scrollTop = top;
  lastRoute = r;
  syncNotif();
}
window.addEventListener('hashchange', render);

/* ---------- 동작 ---------- */
function afterAdd(sel) { var el = app.querySelector(sel); if (el) el.focus(); }
app.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  if (act === 'back') { location.hash = '#home'; return; }
  if (act === 'theme') {
    var next = curTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (er) { }
    render(); return;
  }
  if (act === 'complete') {
    if (S.done[id]) return;
    if (id === 'mental' && !(S.mental.emo && S.mental.body)) return;
    var t = now(); S.done[id] = id === 'attend' ? { at: t, late: isLate(t) } : { at: t };
    save(); location.hash = '#home'; if (route() === 'home') render(); return;
  }
  if (act === 'answer') {
    if (dlInfo().locked) { render(); return; }   // 마감 후에는 응답 불가
    S.answer = { v: el.getAttribute('data-v'), at: now() }; save(); render(); return;
  }
  if (act === 'export-xlsx') {
    var fname = 'ELITE_루틴기록_' + dstr(now()) + '.xlsx', blob;
    try { blob = buildXlsx(); } catch (er) { exportFail = true; render(); return; }
    function done() { S.lastExport = now(); exportFail = false; exportMsg = ''; save(); render(); }
    function viaLink() {
      if (window.AndroidBridge) {
        var rd = new FileReader();
        rd.onload = function () { var ok = false; try { ok = AndroidBridge.saveFile(fname, String(rd.result).split(',')[1]); } catch (e) { } if (ok) done(); else { exportFail = true; render(); } };
        rd.readAsDataURL(blob); return;
      }
      try {
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000); done();
      } catch (er) { exportFail = true; render(); }
    }
    var cl = window.claude && window.claude.use ? window.claude.use('downloads') : null;
    if (cl && cl.then) {
      cl.then(function (dl) {
        if (!dl) { viaLink(); return; }
        dl.save({ filename: fname, data: blob }).then(done, function (er) {
          if (er && er.code === 'declined') { exportMsg = '저장을 취소했어요.'; render(); } else { exportFail = true; render(); }
        });
      }, viaLink);
    } else viaLink();
    return;
  }
  if (act === 'm-score') { S.mental[el.getAttribute('data-k')] = +el.getAttribute('data-v'); save(); render(); return; }
  if (act === 'act-start') { var ac = ACTS[id]; if (ac) { runAct = { id: id, end: now() + ac.m * 60000 }; render(); } return; }
  if (act === 'act-stop') { runAct = null; render(); return; }
  if (act === 'act-done') { var pv = S.mental.acts[id]; S.mental.acts[id] = { at: now(), n: (pv ? pv.n : 0) + 1 }; runAct = null; save(); render(); return; }
  if (act === 'notif-toggle') {
    S.notifOn = S.notifOn === false; save();
    try { if (S.notifOn === false) AndroidBridge.clearNotif(); } catch (er) { }
    render(); return;
  }
  if (act === 'log-view') { S.logView = el.getAttribute('data-v'); save(); render(); return; }
  if (act === 'toggle-sample-log') { S.hideSampleLog = !S.hideSampleLog; save(); render(); return; }
  if (act === 'toggle-plan') { S.planDone[id] = !S.planDone[id]; save(); render(); return; }
  if (act === 'del-plan') { S.plan = S.plan.filter(function (x) { return x.id !== id; }); delete S.planDone[id]; save(); render(); return; }
  if (act === 'goal-adj') {
    var g = S.goals.filter(function (x) { return x.id === id; })[0]; if (!g) return;
    var f = el.getAttribute('data-f'), d = +el.getAttribute('data-d');
    g[f] = Math.max(f === 'target' ? 1 : 0, (g[f] || 0) + d); g.sample = false; save(); render(); return;
  }
  if (act === 'client-next') {
    var c = S.clients.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    c.stage = Math.min(STAGES.length - 1, c.stage + 1); c.sample = false; save(); render(); return;
  }
  if (act === 'clear-sample') {
    var k = el.getAttribute('data-k'); S[k] = S[k].filter(function (x) { return !x.sample; }); save(); render(); return;
  }
});
app.addEventListener('submit', function (e) {
  var f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  var kind = f.getAttribute('data-form'), uid = 'u' + now().toString(36) + Math.floor(Math.random() * 1000);
  if (kind === 'plan') {
    var title = f.elements.title.value.trim(); if (!title) { f.elements.title.focus(); return; }
    S.plan.push({ id: uid, title: title.slice(0, 40), time: f.elements.time.value || '' }); save(); render(); afterAdd('[data-form="plan"] input[name="title"]');
  } else if (kind === 'client') {
    var name = f.elements.name.value.trim(); if (!name) { f.elements.name.focus(); return; }
    S.clients.push({ id: uid, name: name.slice(0, 20), stage: 0 }); save(); render(); afterAdd('[data-form="client"] input[name="name"]');
  }
});

/* ---------- 시계: 화면을 열어 둔 채 마감이 지나도 자동으로 잠김 ---------- */
var last = dlInfo();
function tick() {
  var changedDay = rollover(), di = dlInfo();
  if (changedDay || di.locked !== last.locked || di.imminent !== last.imminent) { last = di; render(); return; }
  last = di;
  var c = app.querySelector('[data-clock]'); if (c) c.textContent = hms(now());
  var l = app.querySelector('[data-left]'); if (l) l.textContent = fmtLeft(di.left);
  var al = app.querySelector('[data-actleft]'); if (al && runAct) { var rl = runAct.end - now(); al.textContent = rl > 0 ? fmtLeft(rl) : '시간이 끝났어요'; }
}
setInterval(tick, 1000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
window.addEventListener('focus', tick);
window.addEventListener('pageshow', tick);

/* ---------- 시작 ---------- */
try { var th = localStorage.getItem(THEME_KEY); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); } catch (e) { }
render();
})();
</script>
</body>
</html>
