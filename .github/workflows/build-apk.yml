name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ELITE-Routine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release (휴대폰에서 바로 내려받기용)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ELITE-Routine-pilot.apk
          gh release delete pilot --cleanup-tag --yes || true
          gh release create pilot ELITE-Routine-pilot.apk --title "ELITE 루틴 파일럿 APK" --notes "휴대폰에서 ELITE-Routine-pilot.apk 를 내려받아 설치하세요. (출처를 알 수 없는 앱 설치 허용 필요)" --prerelease
